<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Equipe · Conecta Fatec</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#012457">
  <link rel="icon" href="/kv/fatec-logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Montserrat:wght@500;600;700;800&family=Unbounded:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <style>
    .barra { background: var(--azul-noite); color: #fff; }
    .barra .topo img.fatec { filter: brightness(0) invert(1); }
    .barra .usuario { font-size: 13px; display: flex; gap: 10px; align-items: center; }
    .barra button { font: inherit; font-size: 13px; background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.35); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
    .login { max-width: 420px; margin: 48px auto; }
    .controles { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin-bottom: 18px; }
    .controles label { flex: 1 1 220px; }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
    .kpi { background: #fff; border: 1px solid var(--linha); border-radius: 14px; padding: 14px 16px; }
    .kpi b { display: block; font-family: var(--display); font-size: 28px; color: var(--azul-noite); font-variant-numeric: tabular-nums; }
    .kpi span { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; font-weight: 800; color: var(--tinta-2); }
    .rankings { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); margin-bottom: 18px; }
    .rank h3 { margin: 0 0 10px; font-size: 14px; color: var(--azul-noite); }
    .rank .linha { display: grid; grid-template-columns: 1fr auto; gap: 8px; font-size: 14px; margin-bottom: 6px; }
    .rank .bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--azul); }
    .tabela-wrap { overflow-x: auto; background: #fff; border: 1px solid var(--linha); border-radius: 14px; }
    table { border-collapse: collapse; width: 100%; font-size: 14px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--linha); white-space: nowrap; }
    th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--tinta-2); background: var(--fundo); position: sticky; top: 0; }
    tr.ganhou td { background: #FFF8D6; }
    td a { text-decoration: none; font-weight: 600; }
    .tag { font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: var(--fundo); color: var(--azul); }
    .tag.ouro { background: var(--amarelo); color: var(--azul-noite); }
    .acoes-topo { display: flex; flex-wrap: wrap; gap: 8px; }
    .vazio { text-align: center; color: var(--tinta-2); padding: 40px 16px; }
    /* Sorteio */
    .palco { position: fixed; inset: 0; background: rgba(1, 36, 87, .92); display: grid; place-items: center; z-index: 50; padding: 16px; }
    .palco .card { max-width: 520px; width: 100%; text-align: center; }
    .palco .nome-sorteado { font-family: var(--display); font-size: clamp(26px, 6vw, 40px); color: var(--azul-noite); margin: 10px 0 4px; min-height: 1.3em; }
    .palco .detalhe { color: var(--tinta-2); }
    .palco .acoes { display: grid; gap: 10px; margin-top: 20px; }
    /* QR */
    .qr-box { display: grid; gap: 16px; grid-template-columns: 1fr; }
    @media (min-width: 760px) { .qr-box { grid-template-columns: 1fr 260px; } }
    #qr { background: #fff; padding: 12px; border-radius: 12px; border: 1px solid var(--linha); width: fit-content; margin: 0 auto; }
    .qr-url { font-size: 12px; word-break: break-all; color: var(--tinta-2); text-align: center; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="barra">
    <div class="topo">
      <span style="display:flex;align-items:center;gap:16px" aria-label="Conecta Fatec"><b style="font-family:var(--script);font-weight:700;font-size:38px;line-height:1;color:var(--amarelo);transform:rotate(-4deg) translateY(2px);display:inline-block">Conecta</b><img class="fatec" src="/kv/fatec-logo.svg" alt="Fatec"></span>
      <div class="usuario oculto" id="usuario"><span id="email"></span><button id="sair">Sair</button></div>
    </div>
  </div>

  <!-- Login -->
  <div class="login card" id="telaLogin">
    <h2>Área da equipe</h2>
    <p class="dica" style="margin:0 0 16px">Acesso restrito ao administrador.</p>
    <div id="msgLogin" class="oculto"></div>
    <button class="btn azul" type="button" id="entrarGoogle" style="margin-top:12px">
      <svg viewBox="0 0 48 48" width="22" height="22" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      Entrar com Google
    </button>
  </div>

  <!-- Painel -->
  <main class="wrap oculto" id="telaPainel">
    <div class="controles">
      <label>Ação
        <select id="origem"><option value="">Escolha para carregar…</option></select>
      </label>
      <label>Buscar <input id="busca" placeholder="Nome, WhatsApp, cidade ou escola" disabled></label>
      <div class="acoes-topo">
        <button class="btn claro pequeno" id="recarregar" disabled>Recarregar</button>
        <button class="btn claro pequeno" id="exportar" disabled>Baixar planilha</button>
        <button class="btn pequeno oculto" id="sortear">Sortear</button>
      </div>
    </div>
    <div id="aoVivo" class="dica" style="margin:-8px 0 12px;color:var(--ok);font-weight:700"></div>
    <div id="msgPainel" class="oculto"></div>

    <div id="conteudo" class="vazio">Escolha uma ação acima. Nada é carregado antes disso.</div>

    <section class="card" style="margin-top:28px">
      <h2>QR Code das barracas do ENEM</h2>
      <div class="qr-box">
        <div>
          <form id="formQr">
            <label>Colégio da barraca
              <select id="qrLocal"></select>
              <span class="dica">Vai junto no cadastro, para saber de qual barraca veio cada pessoa. O mesmo QR vale para 08/11 e 15/11 (o dia é pela data).</span>
            </label>
            <label id="qrOutroWrap" class="oculto">Outro local
              <input id="qrOutro" maxlength="80" placeholder="Nome do local">
            </label>
            <label>Dia
              <select id="qrDia"><option value="">Automático pela data (recomendado)</option></select>
            </label>
            <div class="acoes-topo">
              <button class="btn azul pequeno" type="submit">Ver QR</button>
              <button class="btn claro pequeno" type="button" id="imprimirQr">Imprimir este</button>
              <button class="btn pequeno" type="button" id="imprimirTodos">Imprimir todos os colégios</button>
              <a class="btn claro pequeno" id="modoBarraca" href="/enem/?barraca=1">Abrir modo barraca</a>
            </div>
          </form>
        </div>
        <div><div id="qr"></div><div class="qr-url" id="qrUrl"></div></div>
      </div>
    </section>
  </main>

  <div class="palco oculto" id="palco">
    <div class="card">
      <span class="selo" style="margin:0 auto">Sorteio · <span id="palcoDia"></span></span>
      <div class="nome-sorteado" id="palcoNome">…</div>
      <div class="detalhe" id="palcoDetalhe"></div>
      <div class="acoes">
        <button class="btn" id="confirmar" disabled>Registrar ganhador</button>
        <button class="btn claro" id="deNovo">Sortear de novo (não registra)</button>
        <button class="btn claro" id="fechar">Fechar</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script type="module">
    import { ORIGENS, AULAO, ENEM, SITE_URL } from "/js/config.js";
    import { db, auth, formatarWhatsapp, mostrarMsg } from "/js/base.js";
    import { GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { collection, query, where, onSnapshot, doc, updateDoc, serverTimestamp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    let leads = [], origemAtual = "", usuario = null;

    // ---------- Login ----------
    const ADMINS = ["suporte.ava@fatecivaipora.com.br", "suporteavafatec@gmail.com"]; // quem pode entrar no painel
    const ehAdmin = u => !!u && ADMINS.includes((u.email || "").toLowerCase());
    $("entrarGoogle").onclick = async () => {
      const prov = new GoogleAuthProvider();
      prov.setCustomParameters({ prompt: "select_account" });
      try {
        const { user } = await signInWithPopup(auth, prov);
        if (!ehAdmin(user)) {
          await signOut(auth);
          mostrarMsg($("msgLogin"), "Este e-mail não tem acesso ao painel.");
        }
      } catch (err) {
        console.error(err);
        if (err.code !== "auth/popup-closed-by-user" && err.code !== "auth/cancelled-popup-request")
          mostrarMsg($("msgLogin"), "Não deu para entrar (" + (err.code || "erro") + "). Tente de novo.");
      }
    };
    $("sair").onclick = () => signOut(auth);
    onAuthStateChanged(auth, u => {
      if (!ehAdmin(u)) u = null;
      usuario = u;
      $("telaLogin").classList.toggle("oculto", !!u);
      $("telaPainel").classList.toggle("oculto", !u);
      $("usuario").classList.toggle("oculto", !u);
      $("email").textContent = u?.email || "";
    });

    // ---------- Escolha da ação (só carrega depois de escolher) ----------
    $("origem").innerHTML += ORIGENS.map(o => `<option value="${o.origem}">${o.rotulo}</option>`).join("");
    $("qrDia").innerHTML += ENEM.dias.map(d => `<option value="${d.data.slice(-2)}">${d.rotulo}</option>`).join("");
    $("origem").onchange = () => carregar($("origem").value);
    $("recarregar").onclick = () => carregar(origemAtual);
    $("busca").oninput = desenhar;

    // Tempo real: depois de escolher a ação, novas inscrições aparecem sozinhas
    // (o Firestore só lê de novo o que mudou).
    let pararDeOuvir = null;
    function carregar(origem) {
      if (pararDeOuvir) { pararDeOuvir(); pararDeOuvir = null; }
      origemAtual = origem; leads = [];
      $("msgPainel").className = "oculto";
      const ativo = !!origem;
      ["busca", "recarregar", "exportar"].forEach(id => $(id).disabled = !ativo);
      $("sortear").classList.toggle("oculto", !origem.startsWith("enem"));
      if (!ativo) { $("aoVivo").textContent = ""; $("conteudo").className = "vazio"; $("conteudo").textContent = "Escolha uma ação acima."; return; }
      $("conteudo").className = "vazio"; $("conteudo").textContent = "Carregando…";
      pararDeOuvir = onSnapshot(query(collection(db, "leads"), where("origem", "==", origem)), snap => {
        leads = snap.docs.map(d => ({ id: d.id, ...d.data({ serverTimestamps: "estimate" }) }))
          .sort((a, b) => (b.criadoEm?.seconds || 0) - (a.criadoEm?.seconds || 0));
        $("aoVivo").textContent = "● ao vivo · atualizado " + new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
        desenhar();
      }, err => {
        console.error(err);
        $("conteudo").textContent = "";
        mostrarMsg($("msgPainel"), err.code === "permission-denied"
          ? "Este e-mail não tem acesso ao painel."
          : "A conexão caiu. Clique em Recarregar.");
      });
    }

    function filtrados() {
      const t = $("busca").value.trim().toLowerCase();
      if (!t) return leads;
      const td = t.replace(/\D/g, "");
      return leads.filter(l =>
        [l.nome, l.cidade, l.escola, l.curso, l.local].some(v => (v || "").toLowerCase().includes(t))
        || (td && l.whatsapp.includes(td)));
    }

    function contar(campo) {
      const m = new Map();
      // "curso" pode ter vários separados por vírgula: conta cada um
      leads.forEach(l => (campo === "curso" ? String(l[campo] || "").split(",") : [String(l[campo] || "")])
        .map(k => k.trim()).filter(Boolean).forEach(k => m.set(k, (m.get(k) || 0) + 1)));
      return [...m].sort((a, b) => b[1] - a[1]);
    }
    function ranking(titulo, pares) {
      const top = pares.slice(0, 6), max = top[0]?.[1] || 1;
      return `<div class="card rank"><h3>${titulo}</h3>${top.map(([k, v]) =>
        `<div class="linha"><span>${esc(k)}</span><b>${v}</b><div class="bar" style="width:${(v / max) * 100}%"></div></div>`).join("")
        || '<span class="dica">Sem dados ainda.</span>'}</div>`;
    }
    const hora = l => l.criadoEm ? new Date(l.criadoEm.seconds * 1000).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "";

    function desenhar() {
      const aulao = origemAtual === AULAO.origem;
      const lista = filtrados();
      const extra = aulao
        ? { n: leads.filter(l => l.presente).length, r: "Presentes" }
        : { n: leads.filter(l => l.cadastradoPor).length, r: "Cadastrados pela equipe" };
      const kpis = `<div class="kpis">
        <div class="kpi"><b>${leads.length}</b><span>${aulao ? "Inscritos" : "Participantes"}</span></div>
        <div class="kpi"><b>${contar("cidade").length}</b><span>Cidades</span></div>
        ${aulao ? `<div class="kpi"><b>${contar("escola").length}</b><span>Escolas</span></div>` : ""}
        <div class="kpi"><b>${extra.n}</b><span>${extra.r}</span></div>
        ${aulao ? "" : `<div class="kpi"><b>${leads.filter(l => l.sorteado).length}</b><span>Sorteados</span></div>`}
      </div>`;
      const ranks = `<div class="rankings">${ranking("Cidades", contar("cidade"))}${aulao ? ranking("Escolas", contar("escola")) : ""}
        ${aulao ? "" : ranking("Cursos de interesse", contar("curso"))}</div>`;
      const linhas = lista.map(l => `<tr class="${l.sorteado ? "ganhou" : ""}">
        ${aulao ? `<td><input type="checkbox" data-presente="${l.id}" ${l.presente ? "checked" : ""} aria-label="Presente"></td>` : ""}
        <td>${esc(l.nome)} ${l.sorteado ? '<span class="tag ouro">Ganhou</span>' : ""}</td>
        <td><a href="https://wa.me/55${l.whatsapp}" target="_blank" rel="noopener">${formatarWhatsapp(l.whatsapp)}</a></td>
        <td>${esc(l.cidade)}</td>${aulao ? `<td>${esc(l.escola)}</td>` : ""}
        ${aulao ? "" : `<td>${esc(l.curso)}</td><td>${esc(l.local)}</td><td>${l.cadastradoPor ? '<span class="tag">equipe</span>' : ""}</td>`}
        <td>${hora(l)}</td></tr>`).join("");
      $("conteudo").className = "";
      $("conteudo").innerHTML = kpis + ranks + `<div class="tabela-wrap"><table><thead><tr>
        ${aulao ? "<th>Presente</th>" : ""}<th>Nome</th><th>WhatsApp</th><th>Cidade</th>${aulao ? "<th>Escola</th>" : ""}
        ${aulao ? "" : "<th>Curso</th><th>Barraca</th><th>Origem</th>"}<th>Quando</th></tr></thead>
        <tbody>${linhas || `<tr><td colspan="9" class="vazio">${leads.length ? "Nada encontrado na busca." : "Ninguém cadastrado ainda."}</td></tr>`}</tbody></table></div>`;
    }

    // Presença do aulão
    $("conteudo").addEventListener("change", async e => {
      const id = e.target.dataset?.presente; if (!id) return;
      const l = leads.find(x => x.id === id), v = e.target.checked;
      try {
        await updateDoc(doc(db, "leads", id), { presente: v, presenteEm: serverTimestamp() });
        l.presente = v; desenhar();
      } catch (err) { console.error(err); e.target.checked = !v; mostrarMsg($("msgPainel"), "Não deu para salvar a presença."); }
    });

    // ---------- Planilha (CSV que abre no Excel) ----------
    $("exportar").onclick = () => {
      const cab = ["Nome", "WhatsApp", "Cidade", "Escola", "Curso", "Barraca", "Cadastrado por", "Presente", "Sorteado", "Data"];
      const cel = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
      const linhas = filtrados().map(l => [l.nome, formatarWhatsapp(l.whatsapp), l.cidade, l.escola, l.curso, l.local,
        l.cadastradoPor, l.presente ? "Sim" : "", l.sorteado ? "Sim" : "",
        l.criadoEm ? new Date(l.criadoEm.seconds * 1000).toLocaleString("pt-BR") : ""].map(cel).join(";"));
      const blob = new Blob(["﻿" + [cab.join(";"), ...linhas].join("\r\n")], { type: "text/csv;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = `leads_${origemAtual}.csv`; a.click();
      URL.revokeObjectURL(a.href);
    };

    // ---------- Sorteio ----------
    let candidato = null;
    function sortearUm() {
      const pool = leads.filter(l => !l.sorteado);
      if (!pool.length) { $("palcoNome").textContent = "Ninguém disponível"; $("palcoDetalhe").textContent = ""; $("confirmar").disabled = true; return; }
      $("confirmar").disabled = true;
      let giros = 0;
      const t = setInterval(() => {
        $("palcoNome").textContent = pool[Math.floor(Math.random() * pool.length)].nome;
        if (++giros > 18) {
          clearInterval(t);
          const r = new Uint32Array(1); crypto.getRandomValues(r);
          candidato = pool[r[0] % pool.length];
          $("palcoNome").textContent = candidato.nome;
          $("palcoDetalhe").textContent = `${candidato.cidade} · ${candidato.escola} · ${formatarWhatsapp(candidato.whatsapp)}`;
          $("confirmar").disabled = false;
        }
      }, 70);
    }
    $("sortear").onclick = () => {
      $("palcoDia").textContent = ORIGENS.find(o => o.origem === origemAtual)?.rotulo || "";
      $("palco").classList.remove("oculto"); sortearUm();
    };
    $("deNovo").onclick = sortearUm;
    $("fechar").onclick = () => $("palco").classList.add("oculto");
    $("confirmar").onclick = async () => {
      if (!candidato) return;
      $("confirmar").disabled = true;
      try {
        await updateDoc(doc(db, "leads", candidato.id), { sorteado: true, sorteadoEm: serverTimestamp(), sorteadoPor: usuario.email });
        candidato.sorteado = true; $("palco").classList.add("oculto"); desenhar();
      } catch (err) { console.error(err); $("palcoDetalhe").textContent = "Não deu para registrar. Tente de novo."; $("confirmar").disabled = false; }
    };

    // ---------- QR Code ----------
    // Colégios das barracas (config.js → ENEM.locais) + "Outro local"
    $("qrLocal").innerHTML = ENEM.locais.map(l => `<option value="${l.id}">${esc(l.nome)}</option>`).join("")
      + `<option value="__outro">Outro local…</option>`;
    $("qrLocal").onchange = () => {
      $("qrOutroWrap").classList.toggle("oculto", $("qrLocal").value !== "__outro");
      $("formQr").requestSubmit();
    };
    // O QR leva só o código curto (ex.: ?local=idalia) → QR mais simples de ler
    const localEscolhido = () => $("qrLocal").value === "__outro" ? $("qrOutro").value.trim() : $("qrLocal").value;
    const nomeLocal = id => ENEM.locais.find(l => l.id === id)?.nome || id;

    // O QR aponta sempre para o endereço público (SITE_URL), mesmo se o painel for aberto em outro lugar
    function urlQr(local, dia = $("qrDia").value) {
      const u = new URL("/enem/", SITE_URL);
      if (local) u.searchParams.set("local", local);
      if (dia) u.searchParams.set("dia", dia);
      return u.toString();
    }
    function qrDataUrl(texto) {
      const tmp = document.createElement("div");
      new QRCode(tmp, { text: texto, width: 600, height: 600, colorDark: "#012457", correctLevel: QRCode.CorrectLevel.M });
      return tmp.querySelector("canvas").toDataURL("image/png");
    }
    $("formQr").addEventListener("submit", e => {
      e.preventDefault();
      const url = urlQr(localEscolhido());
      $("qr").innerHTML = "";
      new QRCode($("qr"), { text: url, width: 220, height: 220, colorDark: "#012457", correctLevel: QRCode.CorrectLevel.M });
      $("qrUrl").textContent = url;
      const b = new URL(url); b.searchParams.set("barraca", "1"); $("modoBarraca").href = b.pathname + b.search;
    });
    $("formQr").requestSubmit(); // já mostra o QR do primeiro colégio

    // Folha A4 por colégio: "Vai fazer o ENEM?" + QR grande + nome do colégio
    function imprimir(locais) {
      const paginas = locais.map(local => `
        <section class="pag">
          <div class="topo"><img class="logo" src="${SITE_URL}/kv/fatec-logo.svg" alt="Fatec Ivaiporã"></div>
          <h1>Vai fazer o ENEM?</h1>
          <p class="sub">Aponte a câmera do celular e concorra a<br><b>${esc(ENEM.premio)}</b>!</p>
          <img class="qr" src="${qrDataUrl(urlQr(local))}" alt="">
          <p class="passo">1. Abra a câmera &nbsp; 2. Aponte para o código &nbsp; 3. Preencha seus dados</p>
          <p class="local">${esc(nomeLocal(local))}</p>
          <p class="rod">Conecta Fatec · Fatec Ivaiporã · #vempramelhor</p>
        </section>`).join("");
      const w = window.open("", "_blank");
      w.document.write(`<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>QR ENEM · barracas</title>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=Unbounded:wght@800&display=swap" rel="stylesheet">
        <style>
          @page { size: A4; margin: 0; }
          body { margin: 0; font-family: Montserrat, sans-serif; color: #012457; }
          .pag { height: 297mm; box-sizing: border-box; padding: 0 16mm 16mm; display: flex; flex-direction: column; align-items: center; text-align: center; page-break-after: always; border-bottom: 6mm solid #F04E23; }
          .topo { align-self: stretch; margin: 0 -16mm 10mm; background: #3157B0; padding: 7mm 0; }
          .pag:last-child { page-break-after: auto; }
          .logo { height: 14mm; display: block; margin: 0 auto; }
          h1 { font-family: Unbounded, sans-serif; font-size: 34pt; margin: 0; }
          .sub { font-size: 17pt; margin: 4mm 0 8mm; font-weight: 600; }
          .qr { width: 125mm; height: 125mm; image-rendering: pixelated; }
          .passo { font-size: 12pt; font-weight: 600; color: #516684; margin: 6mm 0 0; }
          .local { font-size: 15pt; font-weight: 800; margin: auto 0 2mm; padding: 3mm 6mm; background: #FCD116; border-radius: 3mm; }
          .rod { font-size: 11pt; font-weight: 800; color: #F04E23; margin: 2mm 0 0; }
        </style>
        <body>${paginas}<script>onload=()=>setTimeout(()=>print(),400)<\/script></body></html>`);
      w.document.close();
    }
    $("imprimirQr").onclick = () => imprimir([localEscolhido()]);
    $("imprimirTodos").onclick = () => imprimir(ENEM.locais.map(l => l.id));
  </script>
</body>
</html>
